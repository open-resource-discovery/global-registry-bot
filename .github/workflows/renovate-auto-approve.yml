name: Renovate auto-approve

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- Metadata-only bot approval; never checks out or runs PR code.
    branches: [main]

permissions:
  contents: read
jobs:
  auto-approve:
    if: github.event.pull_request.user.id == 29139614 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: hmarr/auto-approve-action@f0939ea97e9205ef24d872e76833fa908a770363 # v4.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      pull-requests: write
