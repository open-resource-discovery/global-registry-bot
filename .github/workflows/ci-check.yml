name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned npm for dependency policy
        run: npm install --global --ignore-scripts npm@11.21.3 --registry=https://registry.npmjs.org/

      - name: Verify locked install script policy
        run: node scripts/check-install-scripts.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline

      - name: Prettier check
        run: npm run prettier:check

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Trusted metadata boundary tests
        run: npm run test:trusted-review

      - name: Tests (coverage)
        run: npm run test:coverage
